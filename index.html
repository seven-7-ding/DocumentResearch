<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文日历 · Research Library</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><span class="eyebrow">PERSONAL RESEARCH LIBRARY</span><h1>每天，读懂一点前沿。</h1><p>每日论文推荐、深度解读与后续讨论，汇集在同一份阅读档案。</p></header>
<section class="toolbar" aria-label="筛选日报"><label>归档月份 <select id="month" aria-label="归档月份"></select></label><label>本月查找 <input id="query" type="search" placeholder="日期或日报标题"></label><span id="count" aria-live="polite"></span></section>
<p id="status" role="status">正在加载阅读档案…</p><section id="reports" aria-label="论文日报列表"></section>
<footer>按月整理 · 点开日报继续阅读<br>已发布内容由 GitHub Pages 托管，本机关闭后仍可访问。</footer>
</main><script src="app.js"></script></body></html>
